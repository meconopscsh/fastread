<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6秒リーディング</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f1ea;
  --surface: #fffdf8;
  --ink: #23211d;
  --muted: #6f6a60;
  --line: #dcd5c6;
  --accent: #2c6db5;
  --accent-ink: #ffffff;
  --accent-soft: rgba(44, 109, 181, .13);
  --band: rgba(44, 109, 181, .2);
  --mark: #c93b27;
  --flag: #c86f00;
  --ok: #2f8a57;
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 6px 18px rgba(0, 0, 0, .05);
  --ui: "Yu Gothic UI", "Meiryo UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --mincho: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
  --gothic: "Yu Gothic", "YuGothic", "Meiryo", "Hiragino Sans", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151412;
    --surface: #1f1d1a;
    --ink: #e9e5dc;
    --muted: #a29c90;
    --line: #38352f;
    --accent: #6ea8ea;
    --accent-ink: #0c1724;
    --accent-soft: rgba(110, 168, 234, .17);
    --band: rgba(110, 168, 234, .26);
    --mark: #ff7b64;
    --flag: #ffb445;
    --ok: #5cc489;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.6; min-height: 100vh; }
body.running { cursor: none; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.3; }
h2 { font-size: 22px; margin: 4px 0 16px; }
h3 { font-size: 16px; margin: 0 0 10px; }
.muted { color: var(--muted); }

.topbar { display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 10; }
.brand { font-weight: 700; font-size: 16px; background: none; border: 0; padding: 0; cursor: pointer; }
#nav { display: flex; gap: 2px; margin-left: auto; }
#nav button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); }
#nav button:hover, #nav button.on { color: var(--ink); background: var(--accent-soft); }
#session-bar { display: flex; align-items: center; gap: 14px; margin-left: auto; }
#session-bar[hidden], #nav[hidden] { display: none; }
.steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
.steps li { padding: 3px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); border: 1px solid transparent; }
.steps li.on { color: var(--ink); background: var(--accent-soft); border-color: var(--line); font-weight: 600; }
.steps li.done { color: var(--ok); }

main { max-width: 1100px; margin: 0 auto; padding: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 16px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.big { padding: 12px 28px; font-size: 17px; }
.btn.sm { padding: 4px 12px; }
.btn.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.danger { color: var(--mark); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.spacer { flex: 1; }

/* ホーム */
.hero { padding: 8px 0 4px; }
.hero h1 { font-size: 28px; margin: 0 0 6px; }
.hero p { margin: 0 0 18px; color: var(--muted); }
.flow { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; padding: 0; list-style: none; }
.flow li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 14px; }
.stats { display: flex; gap: 28px; flex-wrap: wrap; }
.stat b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }

/* セッション */
.panel { height: 8.6rem; overflow: hidden; display: flex; flex-direction: column; justify-content: safe center; gap: 6px; max-width: 980px; margin: 0 auto; }
@media (max-width: 820px) {
  .panel { height: 12.5rem; }
  .steps li { padding: 3px 6px; font-size: 12px; white-space: nowrap; }
}
.pn-title { font-size: 18px; font-weight: 700; }
.pn-title.muted { font-weight: 400; }
.pn-text { color: var(--muted); }
.pn-text b { color: var(--mark); font-weight: 600; }
.pn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.big-num { font-size: 22px; font-variant-numeric: tabular-nums; color: var(--mark); }
#mk-need.warn { color: var(--mark); font-weight: 600; }
.stage { position: relative; }

.passage { --fs: 22px; --cpl: 40; margin: 0 auto; width: calc(var(--cpl) * 1em); max-width: calc(100% - 2.4em); font-size: var(--fs); line-height: 1.9; font-family: var(--mincho); background: var(--surface); padding: .7em 1.2em 0; border-radius: 10px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; box-sizing: content-box; line-break: strict; user-select: none; }
.passage.gothic { font-family: var(--gothic); }
.passage p { margin: 0; }
.passage p.h { text-align: center; color: var(--muted); }
.passage .c, .passage .w { position: relative; }
.passage.is-hidden .c, .passage.is-hidden .w { visibility: hidden; }
.passage .flag { box-shadow: inset 0 -.2em 0 var(--flag); }
.passage .flag::after { content: "⚑"; visibility: visible; position: absolute; left: 50%; top: -.95em; transform: translateX(-50%); font-family: var(--ui); font-size: .7em; line-height: 1; color: var(--flag); }
.passage.is-marking .c { cursor: pointer; }
.passage.is-marking .c:hover { outline: 1px solid var(--accent); }
.passage .c.read { background: var(--accent-soft); }
.passage .c.mark { background: transparent; color: var(--mark); box-shadow: inset 0 -.2em 0 var(--mark); }
.fixation { position: absolute; transform: translate(-50%, -50%); width: 1.7em; height: 1.7em; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-family: var(--ui); font-weight: 700; font-size: 22px; pointer-events: none; }
.fixation[hidden] { display: none; }

.stretch { text-align: center; padding: 18px 0; }
.st-name { font-size: 28px; font-weight: 700; }
.st-beat { font-size: 88px; font-weight: 700; height: 1.35em; line-height: 1.35; color: var(--accent); }
.st-count { font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.st-how { max-width: 38em; margin: 14px auto 0; color: var(--muted); }
.st-center { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin: 26px auto; }
#overlay { position: fixed; inset: 0; z-index: 50; background: var(--bg); }
#overlay[hidden] { display: none; }
#overlay .dot { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); }
#overlay .ov-bar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; color: var(--muted); white-space: nowrap; }

/* 結果・記録 */
.result-main { font-size: 20px; margin: 4px 0 12px; }
.result-main b { font-size: 34px; font-variant-numeric: tabular-nums; }
.result-main .diff { font-weight: 700; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--ui); }
.chart .band { fill: var(--band); }
.chart .ln-pre { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .pt-pre { fill: var(--accent); }
.chart .pt-post { fill: none; stroke: var(--flag); stroke-width: 2; }
.chart .pt-ctrl { fill: none; stroke: var(--muted); stroke-width: 2; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; color: var(--muted); }

/* 設定 */
.form { display: grid; grid-template-columns: 11em 1fr; gap: 12px 18px; align-items: center; }
.form label { color: var(--muted); }
.form .ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.form output { font-variant-numeric: tabular-nums; min-width: 4em; }
.form input[type="range"] { width: 240px; }
.form input[type="number"] { width: 5em; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.preview { margin: 16px 0 0; max-height: 7.6em; }

.modal-back { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: grid; place-items: center; z-index: 100; padding: 16px; }
.modal { background: var(--surface); color: var(--ink); max-width: 560px; border-radius: 14px; padding: 22px 26px; box-shadow: 0 10px 40px rgba(0, 0, 0, .3); }
.modal ul { padding-left: 1.2em; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; z-index: 200; max-width: min(640px, calc(100% - 32px)); }
#toast[hidden] { display: none; }
</style>
</head>
<body>
<header class="topbar">
  <button class="brand" data-nav="home">6秒リーディング</button>
  <nav id="nav">
    <button data-nav="home">ホーム</button>
    <button data-nav="history">記録</button>
    <button data-nav="settings">設定</button>
    <button data-nav="about">このアプリについて</button>
  </nav>
  <div id="session-bar" hidden>
    <ol class="steps" id="steps"></ol>
    <button class="btn sm" id="abort-btn">中断（Esc）</button>
  </div>
</header>
<main id="app"></main>
<div id="overlay" hidden></div>
<div id="modal"></div>
<div id="toast" hidden></div>
<script src="texts.js"></script>
<script>
'use strict';

const STORIES = window.STORIES || [];
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtDateTime = iso => { const d = new Date(iso); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtMD = iso => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}`; };
const fmtMult = v => String(Math.round(v * 100) / 100);
const signed = n => (n > 0 ? `+${n}` : String(n));
const idxOr = (i, fallback) => (i < 0 ? fallback : i);

const COMP = [
  { key: 'good', label: 'よく分かった' },
  { key: 'ok', label: 'だいたい' },
  { key: 'poor', label: 'あまり' },
];
const COMP_LABEL = Object.fromEntries(COMP.map(c => [c.key, c.label]));
const ROUNDS = [
  { key: 'reached', label: '⚑まで届いた（読めない速さで）' },
  { key: 'readable', label: '届いたが、読めてしまった' },
  { key: 'short', label: '⚑まで届かなかった' },
];
const ROUND_LABEL = { reached: '届いた', readable: '読めてしまった', short: '届かなかった' };

// ---------- 保存 ----------
const STORE_KEY = 'six-second-reading.v1';
const DEFAULT_SETTINGS = {
  fontSize: 22,
  cpl: 40,
  font: 'mincho',
  volume: 0.5,
  stretchMode: 'finger',
  stretchTempo: 'normal',
  stretchReps: 12,
  multiplier: 3,
  autoMultiplier: true,
  remeasure: 'unread',
};

function normalizeState(s = {}) {
  const ids = new Set(STORIES.map(x => x.id));
  const p = s.progress || {};
  const okSession = x => x && x.pre && x.post && Number.isFinite(x.pre.count) && Number.isFinite(x.post.count) && x.date;
  return {
    version: 1,
    ackCaution: !!s.ackCaution,
    // 今はない設定（音声ガイドなど）は読み込まない
    settings: { ...DEFAULT_SETTINGS, ...Object.fromEntries(Object.entries(s.settings || {}).filter(([k]) => k in DEFAULT_SETTINGS)) },
    progress: {
      storyId: ids.has(p.storyId) ? p.storyId : (STORIES[0] && STORIES[0].id),
      cursors: Object.fromEntries(Object.entries(p.cursors || {}).filter(([k, v]) => ids.has(k) && Number.isFinite(v) && v >= 0)),
    },
    sessions: Array.isArray(s.sessions)
      ? s.sessions.filter(okSession).map(x => ({ ...x, rounds: Array.isArray(x.rounds) ? x.rounds : [] }))
      : [],
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return normalizeState(JSON.parse(raw));
  } catch { /* 読めなければ初期状態 */ }
  return normalizeState();
}

let state = loadState();

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch {
    toast('記録を保存できませんでした。「記録」画面の書き出しで控えを取ってください。');
  }
}

// ---------- 文章 ----------
// 位置はすべて作品内の「見た目の1文字」(書記素)の番号。空白・改行・見出し（「一」「第一夜」など）は字数に数えない。
const SEG = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('ja', { granularity: 'grapheme' }) : null;
const toGraphemes = s => (SEG ? Array.from(SEG.segment(s), x => x.segment) : Array.from(s));
const SENT_END = new Set(['。', '！', '？', '!', '?']);
const NOT_SENT_HEAD = /^[」』）〕】〉》”’。、！？!?…―]$/u;
const PARA_END = /^[。！？!?」』）…―]$/u;
const models = new Map();

function model(id) {
  let m = models.get(id);
  if (m) return m;
  const src = STORIES.find(s => s.id === id);
  const head = new Uint8Array(src.paragraphs.length);
  for (const h of src.headings || []) head[h] = 1;
  const g = [], paraOf = [];
  src.paragraphs.forEach((text, pi) => {
    if (pi > 0) { g.push('\n'); paraOf.push(pi - 1); }
    for (const ch of toGraphemes(text)) { g.push(ch); paraOf.push(pi); }
  });
  const n = g.length;
  const para = Int32Array.from(paraOf);
  const counted = new Uint8Array(n);
  const cum = new Int32Array(n);
  // 改行の直後でも、前の行が文の終わりで終わっていなければ（「…と言って」の行や漢詩の各行など）文頭にしない
  const lastVisible = j => { while (j > 0 && /^\s+$/u.test(g[j])) j--; return g[j]; };
  const paraHead = i => g[i - 1] === '\n' && (head[para[i - 1]] || (/^[　「『（]$/u.test(g[i]) && PARA_END.test(lastVisible(i - 2))));
  const starts = [0];
  let c = 0;
  for (let i = 0; i < n; i++) {
    counted[i] = head[para[i]] || /^\s+$/u.test(g[i]) ? 0 : 1;
    c += counted[i];
    cum[i] = c;
    if (i > 0 && g[i] !== '\n' && !head[para[i]] && (paraHead(i) || (SENT_END.has(g[i - 1]) && !NOT_SENT_HEAD.test(g[i])))) starts.push(i);
  }
  m = { id, src, g, n, para, head, counted, cum, total: c, starts: Int32Array.from(starts) };
  models.set(id, m);
  return m;
}

const countBefore = (m, a) => (a > 0 ? m.cum[Math.min(a, m.n) - 1] : 0);
const remaining = (m, a) => m.total - countBefore(m, a);

// a から数えて k 字目にあたる位置。足りなければ -1
function indexAtCount(m, a, k) {
  const want = countBefore(m, a) + k;
  if (k <= 0 || m.total < want) return -1;
  let lo = a, hi = m.n - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (m.cum[mid] >= want) hi = mid; else lo = mid + 1;
  }
  return lo;
}

// i より後ろで最初の文頭。なければ作品の末尾 (n)
function nextSentenceStart(m, i) {
  const s = m.starts;
  let lo = 0, hi = s.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (s[mid] > i) hi = mid; else lo = mid + 1;
  }
  return lo < s.length ? s[lo] : m.n;
}

const storyIds = () => STORIES.map(s => s.id);
const nextStoryId = id => { const ids = storyIds(); return ids[(ids.indexOf(id) + 1) % ids.length]; };
const storyTitle = id => { const s = STORIES.find(x => x.id === id); return s ? `『${s.title}』${s.author}` : id; };

// 次に読む位置。セッション中に読んだ範囲 (S.seen) も考える
function cursorOf(id) {
  const m = model(id);
  let c = clamp(state.progress.cursors[id] || 0, 0, m.n);
  if (S && S.seen[id] != null) c = Math.max(c, nextSentenceStart(m, S.seen[id]));
  return c === 0 ? 0 : nextSentenceStart(m, c - 1);
}

function pickStart(need, preferId) {
  const ids = storyIds();
  const from = Math.max(0, ids.indexOf(preferId));
  for (let k = 0; k < ids.length; k++) {
    const id = ids[(from + k) % ids.length];
    const start = cursorOf(id);
    if (remaining(model(id), start) >= need) return { m: model(id), start };
  }
  // どの作品にも十分な残りがなければ、すべて最初からにする
  for (const id of ids) state.progress.cursors[id] = 0;
  if (S) S.seen = {};
  toast('収録作品をひととおり読み終えたので、最初から読み直します。');
  return { m: model(ids[from]), start: 0 };
}

// 直近5回の事前計測の中央値。記録がなければ null
function medianPre(sessions) {
  const v = sessions.slice(-5).map(s => s.pre.count).filter(x => x > 0).sort((a, b) => a - b);
  return v.length ? { value: v[v.length >> 1], n: v.length } : null;
}
const recentBaseline = () => medianPre(state.sessions)?.value ?? 100;
const needFor = (est, mult) => Math.round(est * (mult + 3)) + 300;

// 表示する範囲の終わり。画面からはみ出した分は .passage の overflow で隠れる
function passageEnd(m, start, minCount) {
  const t = indexAtCount(m, start, clamp(Math.round(minCount), 500, 2000));
  return t < 0 ? m.n : t + 1;
}

function passageHtml(m, from, to) {
  const open = i => (i < m.n && m.head[m.para[i]] ? '<p class="h">' : '<p>');
  let html = open(from);
  for (let i = from; i < to; i++) {
    const ch = m.g[i];
    if (ch === '\n') { html += `</p>${open(i + 1)}`; continue; }
    html += m.counted[i] ? `<span class="c" data-i="${i}">${esc(ch)}</span>` : `<span class="w">${esc(ch)}</span>`;
  }
  return html + '</p>';
}

function applyPassageStyle(p) {
  const set = state.settings;
  p.style.setProperty('--fs', `${set.fontSize}px`);
  p.style.setProperty('--cpl', set.cpl);
  p.classList.toggle('gothic', set.font === 'gothic');
}

// 画面に収まる行数ぶんの高さにする（最後の行が途中で切れないように）
function fitPassage() {
  const p = $('#passage');
  if (!p) return;
  const cs = getComputedStyle(p);
  const extra = ['paddingTop', 'paddingBottom', 'borderTopWidth', 'borderBottomWidth'].reduce((sum, k) => sum + (parseFloat(cs[k]) || 0), 0);
  const lineH = parseFloat(cs.lineHeight) || state.settings.fontSize * 1.9;
  const avail = window.innerHeight - p.getBoundingClientRect().top - extra - 28;
  p.style.maxHeight = `${Math.max(3, Math.floor(avail / lineH)) * lineH}px`;
}

// ---------- 音 ----------
// 6秒の合図（3・2・1のピッ、表示のポーン、6秒の終わり）、ストレッチの拍（高・低を交互）と種目の終わり、休憩の終わり
const TONES = {
  tick: { f: 880, d: 0.08, g: 0.6, type: 'sine' },
  go: { f: 1320, d: 0.22, g: 0.7, type: 'sine' },
  end: { f: 440, d: 0.35, g: 0.8, type: 'triangle' },
  hi: { f: 1046, d: 0.09, g: 0.5, type: 'sine' },
  lo: { f: 659, d: 0.09, g: 0.5, type: 'sine' },
  done: { f: 784, d: 0.3, g: 0.5, type: 'sine' },
};

const audio = {
  ctx: null,
  nodes: new Set(),
  ensure() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  tone(kind, when) {
    const T = TONES[kind], ctx = this.ctx;
    const o = ctx.createOscillator(), gain = ctx.createGain();
    const v = clamp(state.settings.volume, 0, 1) * T.g;
    o.type = T.type;
    o.frequency.value = T.f;
    gain.gain.setValueAtTime(0, when);
    gain.gain.linearRampToValueAtTime(v, when + 0.01);
    gain.gain.setValueAtTime(v, when + T.d - 0.03);
    gain.gain.linearRampToValueAtTime(0, when + T.d);
    o.connect(gain).connect(ctx.destination);
    o.start(when);
    o.stop(when + T.d + 0.02);
    this.nodes.add(o);
    o.onended = () => this.nodes.delete(o);
  },
  // events: [[種類, ミリ秒]]。0ミリ秒の音が鳴る瞬間の performance.now() を返す
  schedule(events) {
    const lead = 60;
    const ctx = this.ensure();
    if (!ctx || ctx.state !== 'running') return performance.now() + lead;
    const base = ctx.currentTime + lead / 1000;
    if (state.settings.volume > 0) for (const [kind, off] of events) this.tone(kind, base + off / 1000);
    const ts = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
    if (ts && ts.performanceTime > 0) return ts.performanceTime + (base - ts.contextTime) * 1000;
    return performance.now() + lead + (ctx.outputLatency || ctx.baseLatency || 0) * 1000;
  },
  play(kind) { return this.schedule([[kind, 0]]); },
  cancel() {
    for (const o of this.nodes) { try { o.stop(); } catch { /* 停止済み */ } }
    this.nodes.clear();
  },
};

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function streak() {
  const days = new Set(state.sessions.map(s => dayKey(new Date(s.date))));
  const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function chartSvg(list) {
  const W = 760, H = 240, L = 44, R = 16, T = 14, B = 30;
  const n = list.length;
  // 縦軸は0からにせず、記録のある範囲に絞る。数字の差が見えるようにし、誤差の大きさは±5字の帯で示す
  const vals = list.flatMap(s => [s.pre.count, s.post.count]);
  const lo = Math.max(0, Math.min(...vals) - 10), hi = Math.max(...vals) + 10;
  const step = [5, 10, 20, 25, 50, 100, 200, 500].find(v => (hi - lo) / v <= 5) || 1000;
  const bottom = Math.floor(lo / step) * step;
  const top = Math.max(bottom + step * 2, Math.ceil(hi / step) * step);
  const x = i => L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1));
  const y = v => T + (H - T - B) * (1 - (clamp(v, bottom, top) - bottom) / (top - bottom));
  const ticks = Array.from({ length: (top - bottom) / step + 1 }, (_, j) => bottom + j * step);
  const grid = ticks.map(v =>
    `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 8}" y="${y(v) + 4}" class="axis" text-anchor="end">${v}</text>`).join('');
  const band = list.map((s, i) => `${x(i)},${y(s.pre.count + 5)}`)
    .concat(list.map((s, i) => `${x(i)},${y(s.pre.count - 5)}`).reverse()).join(' ');
  const line = list.map((s, i) => `${x(i)},${y(s.pre.count)}`).join(' ');
  // 再計測の印は事前計測の点より後に描き、重なっても隠れないようにする（比較用の回は四角）
  const pre = list.map((s, i) => `
    <circle cx="${x(i)}" cy="${y(s.pre.count)}" r="4" class="pt-pre"><title>${fmtDateTime(s.date)} 事前 ${s.pre.count}字</title></circle>`).join('');
  const post = list.map((s, i) => s.type === 'train'
    ? `<circle cx="${x(i)}" cy="${y(s.post.count)}" r="4.5" class="pt-post"><title>${fmtDateTime(s.date)} 再計測 ${s.post.count}字</title></circle>`
    : `<rect x="${x(i) - 4.5}" y="${y(s.post.count) - 4.5}" width="9" height="9" class="pt-ctrl"><title>${fmtDateTime(s.date)} 再計測（比較用）${s.post.count}字</title></rect>`).join('');
  // 日付は最大7つ。等間隔に置き、最後の回は必ず出す（最後の回との間が間隔の6割に満たないものは省く）
  const every = Math.max(1, Math.ceil((n - 1) / 6));
  const marks = Array.from({ length: n }, (_, i) => i).filter(i => i % every === 0 && n - 1 - i >= Math.ceil(every * 0.6)).concat(n - 1);
  const labels = marks.map(i =>
    `<text x="${x(i)}" y="${H - 8}" class="axis" text-anchor="middle">${fmtMD(list[i].date)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="事前計測と再計測の字数の推移">${grid}<polygon points="${band}" class="band"/><polyline points="${line}" class="ln-pre"/>${pre}${post}${labels}</svg>`;
}

  const diff = rec.post.count - rec.pre.count;
  const noise = Math.abs(diff) <= 5; // ±5字はクリック位置の誤差の範囲なので、伸びとして色を付けない
  const base = medianPre(state.sessions.filter(s => s !== rec));
  const counts = Object.fromEntries(ROUNDS.map(r => [r.key, rec.rounds.filter(x => x === r.key).length]));
  const multNote = rec.nextMultiplier == null ? '' :
    rec.nextMultiplier > rec.multiplier ? '（「読めてしまった」が多かったので上げました）' :
    rec.nextMultiplier < rec.multiplier ? '（「届かなかった」が多かったので下げました）' : '';
  $('#app').innerHTML = `
  <h2>${rec.type === 'train' ? '今回の結果' : '今回の結果（比較用の回）'}</h2>
  <div class="card">
    <div class="result-main">事前 <b>${rec.pre.count}</b>字 → 再計測 <b>${rec.post.count}</b>字
      <span class="diff" style="color:${diff > 5 ? 'var(--ok)' : 'var(--muted)'}">（${signed(diff)}字${noise ? '・誤差の範囲' : ''}）</span></div>
    <p class="muted" style="margin-top:0">±5字くらいはクリック位置の誤差の範囲です。${rec.post.mode === 'same' ? '再計測は最初と同じ文章なので、慣れの分も含んだ体感の数字です。' : '再計測は続きの、まだ読んでいない文章で行いました。'}</p>
    <dl class="kv">
      ${base ? `<dt>事前計測の推移</dt><dd>今回 ${rec.pre.count}字 ／ それまでの直近${base.n}回の中央値 ${base.value}字（${signed(rec.pre.count - base.value)}字）</dd>` : ''}
      <dt>内容の分かり具合</dt><dd>事前：${COMP_LABEL[rec.pre.comp]}　再計測：${COMP_LABEL[rec.post.comp]}</dd>
      ${rec.type === 'train' ? `
      <dt>トレーニング</dt><dd>⚑の位置 ${rec.targetCount}字（×${fmtMult(rec.multiplier)}）／ 届いた ${counts.reached}回・読めてしまった ${counts.readable}回・届かなかった ${counts.short}回</dd>
      <dt>次回の倍率</dt><dd>×${fmtMult(state.settings.multiplier)}${multNote}</dd>` : ''}
      <dt>文章</dt><dd>${esc(storyTitle(rec.storyId))}${rec.post.storyId !== rec.storyId ? ` → ${esc(storyTitle(rec.post.storyId))}` : ''}</dd>
      <dt>連続</dt><dd>${streak()}日</dd>
    </dl>
  </div>
  <div class="row">
    <button class="btn primary" data-nav="home">ホームへ（Enter）</button>
    <button class="btn" data-nav="history">記録を見る</button>
  </div>`;
}

// ---------- セッション ----------
const ABORT = new Error('abort');
const INVALID = new Error('invalid');
let S = null;

function invalidMsg(what) {
  if (S.invalidWhy === 'lag') return `表示の時間が6秒からずれたので、${what}`;
  const why = S.invalidWhy === 'esc' ? '中断の確認をはさんだ' : '画面が切り替わった';
  return `${S.invalidShown ? '6秒' : 'カウント'}の途中で${why}ので、${what}`;
}

function noteSeen(m, idx) {
  S.seen[m.id] = Math.max(S.seen[m.id] ?? -1, idx);
}

function setPanel(html) { $('#panel').innerHTML = html; }

function setStep(step) {
  const order = ['pre', 'stretch', 'train', 'post'];
  const at = order.indexOf(step);
  $$('#steps li').forEach(li => {
    const i = order.indexOf(li.dataset.step);
    li.classList.toggle('on', i === at);
    li.classList.toggle('done', i < at);
  });
}

function showSessionUI(type) {
  $('#nav').hidden = true;
  $('#session-bar').hidden = false;
  $('#steps').innerHTML = type === 'train'
    ? '<li data-step="pre">① 事前計測</li><li data-step="stretch">② ストレッチ</li><li data-step="train">③ トレーニング</li><li data-step="post">④ 再計測</li>'
    : '<li data-step="pre">① 事前計測</li><li data-step="stretch">② 休憩</li><li data-step="train">③ ふつうに読む</li><li data-step="post">④ 再計測</li>';
  $('#app').innerHTML = '<div class="panel" id="panel"></div><div class="stage" id="stage"></div>';
}

function endSessionUI() {
  S = null;
  audio.cancel();
  document.body.classList.remove('running');
  $('#overlay').hidden = true;
  $('#overlay').innerHTML = '';
  $('#nav').hidden = false;
  $('#session-bar').hidden = true;
}

function requestAbort() {
  if (!S || S.asking) return;
  if (S.cancelRun) S.cancelRun(); // 6秒の途中なら、その回は無効にする
  S.asking = true;
  const yes = confirm('セッションを中断しますか？（この回は記録されません）');
  if (!S) return;
  S.asking = false;
  if (yes) S.ac.abort();
}

// keys: { キー: 値 }。[data-act] ボタンのクリックでも解決する。local が中止されたら null を返す
function waitAct(keys = {}, local = null) {
  return new Promise((resolve, reject) => {
    const sig = S.ac.signal;
    if (sig.aborted) { reject(ABORT); return; }
    const cleanup = () => {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('click', onClick);
      sig.removeEventListener('abort', onAbort);
      if (local) local.removeEventListener('abort', onLocal);
    };
    const done = v => { cleanup(); resolve(v); };
    const onKey = e => {
      if (e.repeat || e.isComposing || e.ctrlKey || e.metaKey || e.altKey || modalOpen()) return;
      if (!(e.key in keys)) return;
      e.preventDefault();
      done(keys[e.key]);
    };
    const onClick = e => {
      const b = e.target.closest('[data-act]');
      if (!b || b.disabled) return;
      b.blur();
      done(b.dataset.act);
    };
    const onAbort = () => { cleanup(); reject(ABORT); };
    const onLocal = () => done(null);
    document.addEventListener('keydown', onKey);
    document.addEventListener('click', onClick);
    sig.addEventListener('abort', onAbort);
    if (local) local.addEventListener('abort', onLocal);
  });
}

function mountPassage(m, start, end, flag = -1) {
  $('#stage').innerHTML = `<div class="passage is-hidden" id="passage">${passageHtml(m, start, end)}</div><div class="fixation" id="fixation" hidden></div>`;
  const p = $('#passage');
  applyPassageStyle(p);
  if (flag >= 0) p.querySelector(`[data-i="${flag}"]`)?.classList.add('flag');
  fitPassage();
  return p;
}

// 3・2・1のカウント（数字と音）のあと6秒だけ文章を見せる。カウントの数字は読み始めの位置に出す
function sixSeconds(p) {
  return new Promise((resolve, reject) => {
    const sig = S.ac.signal;
    if (sig.aborted) { reject(ABORT); return; }
    const fix = $('#fixation');
    const first = p.querySelector('.c');
    const sr = $('#stage').getBoundingClientRect();
    const r = first.getBoundingClientRect();
    fix.style.left = `${r.left - sr.left + r.width / 2}px`;
    fix.style.top = `${r.top - sr.top + r.height / 2}px`;
    fix.style.fontSize = `${parseFloat(getComputedStyle(p).fontSize) * 1.8}px`;
    fix.textContent = '3';
    fix.hidden = false;
    clearTimeout(toastTimer);
    $('#toast').hidden = true;
    p.classList.add('is-hidden');
    p.classList.remove('is-marking');
    document.body.classList.add('running');

    // 数字と音は0.4秒ごと。t0 は最初のピッが鳴る瞬間
    const STEP = 400, GO = STEP * 3, END = GO + 6000;
    const t0 = audio.schedule([['tick', 0], ['tick', STEP], ['tick', STEP * 2], ['go', GO], ['end', END]]);
    let raf = 0, shownAt = 0, ended = false;
    const finish = err => {
      if (ended) return;
      ended = true;
      cancelAnimationFrame(raf);
      document.removeEventListener('visibilitychange', onVis);
      sig.removeEventListener('abort', onAbort);
      if (S) {
        S.cancelRun = null;
        if (err === INVALID) S.invalidShown = shownAt > 0;
      }
      fix.hidden = true;
      p.classList.add('is-hidden');
      document.body.classList.remove('running');
      if (err) { audio.cancel(); reject(err); } else resolve(performance.now() - shownAt);
    };
    const onVis = () => { if (document.hidden) { S.invalidWhy = 'hidden'; finish(INVALID); } };
    const onAbort = () => finish(ABORT);
    document.addEventListener('visibilitychange', onVis);
    sig.addEventListener('abort', onAbort);
    S.cancelRun = () => { S.invalidWhy = 'esc'; finish(INVALID); };

    const frame = now => {
      const el = now - t0;
      if (!shownAt) {
        if (el >= GO) {
          shownAt = now;
          fix.hidden = true;
          p.classList.remove('is-hidden');
        } else {
          fix.textContent = String(3 - clamp(Math.floor(el / STEP), 0, 2));
        }
      }
      if (el >= END) {
        // フレームが大きく遅れて、見えていた時間が6秒からずれた回は無効にする
        const lag = Math.abs(now - shownAt - 6000) > 100;
        if (lag) S.invalidWhy = 'lag';
        finish(lag ? INVALID : null);
        return;
      }
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  });
}

function markStep(p, label) {
  return new Promise((resolve, reject) => {
    const sig = S.ac.signal;
    if (sig.aborted) { reject(ABORT); return; }
    const spans = $$('.c', p);
    const pos = new Map(spans.map((el, j) => [el, j]));
    let k = -1, comp = null, finished = false;
    p.classList.remove('is-hidden');
    p.classList.add('is-marking');
    setPanel(`
      <div class="pn-title">${label}：ストップ。読めた最後の文字をクリックし、内容の分かり具合を選んでください</div>
      <div class="pn-row">
        <span>読めた字数 <b class="big-num" id="mk-count">—</b></span>
        <span class="muted" id="mk-hover"></span>
        <span class="muted">← → で1字ずつ調整できます</span>
        <span class="spacer"></span>
        <span class="muted" id="mk-need"></span>
      </div>
      <div class="pn-row">
        <span>内容の分かり具合</span>
        ${COMP.map((c, j) => `<button class="btn sm" data-comp="${c.key}">${j + 1} ${c.label}</button>`).join('')}
        <span class="spacer"></span>
        <button class="btn sm" data-mk="redo">測り直す</button>
        <button class="btn primary" data-mk="ok" id="mk-ok" disabled>確定（Enter）</button>
      </div>`);
    const refresh = () => {
      spans.forEach((el, j) => {
        el.classList.toggle('read', j < k);
        el.classList.toggle('mark', j === k);
      });
      $('#mk-count').textContent = k >= 0 ? `${k + 1}字` : '—';
      $$('[data-comp]').forEach(b => b.classList.toggle('on', b.dataset.comp === comp));
      $('#mk-ok').disabled = !(k >= 0 && comp);
      // 確定できない理由を、確定ボタンの上に出しておく
      const need = $('#mk-need');
      need.textContent = k < 0 && !comp ? '文字のクリックと分かり具合を選ぶと、確定できます'
        : k < 0 ? '読めた最後の文字をクリックすると、確定できます'
        : !comp ? '分かり具合を選ぶと、確定できます（1・2・3キーでも選べます）' : '';
      if (!need.textContent) need.classList.remove('warn');
    };
    const cleanup = () => {
      finished = true;
      p.removeEventListener('mouseover', onOver);
      document.removeEventListener('click', onClick);
      document.removeEventListener('keydown', onKey);
      sig.removeEventListener('abort', onAbort);
      p.classList.remove('is-marking');
    };
    const done = v => { cleanup(); resolve(v); };
    const submit = () => {
      if (k >= 0 && comp) done({ count: k + 1, comp, markIndex: Number(spans[k].dataset.i) });
      else $('#mk-need').classList.add('warn');
    };
    const redo = () => {
      const again = state.settings.remeasure === 'same' && label === '再計測' ? '同じ文章で' : '続きの文章で';
      if (confirm(`この計測をやり直しますか？（${again}測り直します）`) && !finished) {
        done({ redo: true, markIndex: k >= 0 ? Number(spans[k].dataset.i) : null });
      }
    };
    const onClick = e => {
      const c = e.target.closest('.c');
      if (c && pos.has(c)) { k = pos.get(c); refresh(); return; }
      const b = e.target.closest('[data-comp],[data-mk]');
      if (!b || b.disabled) return;
      b.blur();
      if (b.dataset.comp) { comp = b.dataset.comp; refresh(); }
      else if (b.dataset.mk === 'ok') submit();
      else if (b.dataset.mk === 'redo') redo();
    };
    const onOver = e => {
      const c = e.target.closest('.c');
      $('#mk-hover').textContent = c && pos.has(c) ? `（ここまで ${pos.get(c) + 1}字）` : '';
    };
    const onKey = e => {
      if (e.isComposing || e.ctrlKey || e.metaKey || e.altKey || modalOpen()) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); k = Math.min(spans.length - 1, k + 1); refresh(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); if (k > 0) { k--; refresh(); } }
      else if (/^[123]$/.test(e.key)) { comp = COMP[Number(e.key) - 1].key; refresh(); }
      else if (e.key === 'Enter') { e.preventDefault(); submit(); }
    };
    const onAbort = () => { cleanup(); reject(ABORT); };
    refresh();
    p.addEventListener('mouseover', onOver);
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    sig.addEventListener('abort', onAbort);
  });
}

// 読んだ範囲より先の文頭へ移る。残りが足りなければ次の作品へ
function relocate(kind, need) {
  const ps = S[kind];
  if (ps.mode === 'same') return;
  const start = nextSentenceStart(ps.m, Math.max(ps.start, S.seen[ps.m.id] ?? ps.start));
  if (remaining(ps.m, start) >= need) { S[kind] = { ...ps, start }; return; }
  noteSeen(ps.m, ps.m.n - 1);
  S[kind] = { ...pickStart(need, nextStoryId(ps.m.id)), mode: ps.mode };
}

async function measure(kind) {
  const label = kind === 'pre' ? '事前計測' : '再計測';
  const need = kind === 'pre' ? needFor(S.est, S.mult) : Math.round(S.est * 2) + 200;
  for (;;) {
    const ps = S[kind];
    const p = mountPassage(ps.m, ps.start, passageEnd(ps.m, ps.start, S.est * 6));
    const where = kind === 'pre' ? '' : ps.mode === 'same' ? '最初と同じ文章で測ります。' : '続きの、まだ読んでいない文章で測ります。';
    setPanel(`
      <div class="pn-title">${kind === 'pre' ? '①' : '④'} ${label}：ふつうの速さで6秒間、黙読します</div>
      <div class="pn-text">読み始めの位置に3・2・1の数字が出て（ピッ・ピッ・ピッ）、ポーンで文章が現れ、6秒たつと音が鳴って消えます。どこまで読めたかを覚えておいてください。${where}</div>
      <div class="row"><button class="btn primary" data-act="go">開始（Space）</button></div>`);
    await waitAct({ ' ': 'go', Enter: 'go' });
    setPanel(`<div class="pn-title muted">${label}：読んでいます…</div>`);
    const glimpse = idxOr(indexAtCount(ps.m, ps.start, Math.round(S.est * 1.5)), ps.m.n - 1);
    try {
      await sixSeconds(p);
    } catch (e) {
      if (e !== INVALID) throw e;
      // 本文が一度でも見えていたら、読んだかもしれない範囲を飛ばして測り直す
      if (S.invalidShown) { noteSeen(ps.m, glimpse); relocate(kind, need); }
      toast(invalidMsg(S.invalidShown ? 'この計測は無効にしました。測り直してください。' : 'もう一度始めてください。'));
      continue;
    }
    // クリックの画面では本文全体が見えるので、ここで中断しても読んだ範囲として残す
    noteSeen(ps.m, glimpse);
    const res = await markStep(p, label);
    if (res.redo) {
      if (res.markIndex != null) noteSeen(ps.m, res.markIndex);
      relocate(kind, need);
      continue;
    }
    noteSeen(ps.m, res.markIndex);
    return res;
  }
}

const EXERCISES = [
  {
    name: '左右', beats: ['左', '右'], factor: 1, screen: 'lr',
    how: '顔の横（10cmほど離したところ）に両手の人さし指を立て、顔は動かさずに、目だけで左右の指先を交互に見ます。',
    screenHow: '顔は動かさずに、画面の左右に交互に出る点を目だけで追います。',
  },
  {
    name: '上下', beats: ['上', '下'], factor: 1, screen: 'ud',
    how: '額の前とあごの前に人さし指を置き、顔は動かさずに、目だけで上下の指先を交互に見ます。',
    screenHow: '顔は動かさずに、画面の上下に交互に出る点を目だけで追います。',
  },
  {
    name: '遠近', beats: ['近く', '遠く'], factor: 1.6, screen: null,
    how: '片手の人さし指を顔の前（30cmほど）に立て、指先と部屋の奥にある物を交互に見て、そのたびにピントを合わせます。',
  },
  {
    name: '視野', beats: ['引いて', '戻して'], factor: 2.2, screen: null, center: true,
    how: '画面の真ん中の点を見つめたまま、両手を顔の横から少しずつ後ろへ引き、見えなくなる直前で止めて戻します。目は真ん中から動かしません。',
  },
];
const TEMPO_MS = { slow: 750, normal: 550, fast: 420 };

function stretchStage(ex, screen, word, count, reps) {
  return `<div class="stretch">
    <div class="st-name">${ex.name}</div>
    ${ex.center ? '<div class="st-center"></div>' : `<div class="st-beat">${screen ? '' : esc(word)}</div>`}
    <div class="st-count">${ex.center && word ? `${esc(word)}　` : ''}${count} / ${reps}</div>
    <div class="st-how">${esc(screen ? ex.screenHow : ex.how)}</div>
  </div>`;
}

// 拍ごとに音を鳴らし、見る方向を交互に画面に出す。'done' | 'skip' | 'skipall' を返す
function runBeats(ex, beat, reps, screen) {
  return new Promise((resolve, reject) => {
    const sig = S.ac.signal;
    if (sig.aborted) { reject(ABORT); return; }
    const ov = $('#overlay');
    let i = 0, paused = false, timer = 0, ended = false;
    const controls = `
      <button class="btn sm" data-beat="pause" id="pause-btn">一時停止（Space）</button>
      <button class="btn sm" data-beat="skip">飛ばす（→）</button>
      <button class="btn sm" data-beat="skipall">ストレッチを全部飛ばす</button>`;
    if (screen) {
      // 点は最初の拍の音が鳴るまで隠しておく（位置が決まる前に左上に出ないように）
      ov.innerHTML = `<div class="dot" id="dot" style="visibility:hidden"></div><div class="ov-bar"><span id="ov-count"></span>${controls}<span>Esc 中断</span></div>`;
      ov.hidden = false;
    } else {
      setPanel(`<div class="pn-title">② ストレッチ：${ex.name}</div><div class="row">${controls}</div>`);
    }
    const draw = () => {
      const side = (i - 1) % 2;
      const count = Math.floor((i - 1) / 2) + 1;
      if (screen) {
        const dot = $('#dot');
        dot.style.left = ex.screen === 'lr' ? (side === 0 ? '5vw' : '95vw') : '50vw';
        // 下の点は、画面下の操作バーに重ならない高さに置く
        dot.style.top = ex.screen === 'ud' ? (side === 0 ? '5vh' : 'calc(100vh - 90px)') : '50vh';
        dot.style.visibility = '';
        $('#ov-count').textContent = `${ex.name} ${count} / ${reps}`;
      } else {
        $('#stage').innerHTML = stretchStage(ex, false, ex.beats[side], count, reps);
      }
    };
    const end = v => {
      if (ended) return;
      ended = true;
      clearTimeout(timer);
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('click', onClick);
      sig.removeEventListener('abort', onAbort);
      ov.hidden = true;
      ov.innerHTML = '';
      if (v === ABORT) reject(ABORT); else resolve(v);
    };
    const tick = () => {
      if (ended || paused) return;
      if (i >= reps * 2) { audio.play('done'); end('done'); return; }
      const at = audio.play(i % 2 === 0 ? 'hi' : 'lo');
      i++;
      // 画面の切り替えは、音がスピーカーから出る瞬間に合わせる
      setTimeout(() => { if (!ended) draw(); }, Math.max(0, at - performance.now()));
      timer = setTimeout(tick, beat);
    };
    const toggle = () => {
      paused = !paused;
      const b = $('#pause-btn');
      if (b) b.textContent = paused ? '再開（Space）' : '一時停止（Space）';
      clearTimeout(timer);
      if (!paused) timer = setTimeout(tick, beat); // 再開は1拍おいてから（切り替えが速くなりすぎないように）
    };
    const onKey = e => {
      if (e.repeat || modalOpen()) return;
      if (e.key === ' ') { e.preventDefault(); toggle(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); end('skip'); }
    };
    const onClick = e => {
      const b = e.target.closest('[data-beat]');
      if (!b) return;
      b.blur();
      if (b.dataset.beat === 'pause') toggle(); else end(b.dataset.beat);
    };
    const onAbort = () => end(ABORT);
    document.addEventListener('keydown', onKey);
    document.addEventListener('click', onClick);
    sig.addEventListener('abort', onAbort);
    if (!screen) $('#stage').innerHTML = stretchStage(ex, false, '', 0, reps);
    tick();
  });
}

async function stretch() {
  const set = state.settings;
  const reps = clamp(Math.round(set.stretchReps) || 12, 4, 30);
  const base = TEMPO_MS[set.stretchTempo] || TEMPO_MS.normal;
  for (let x = 0; x < EXERCISES.length; x++) {
    const ex = EXERCISES[x];
    const screen = set.stretchMode === 'screen' && !!ex.screen;
    $('#stage').innerHTML = stretchStage(ex, screen, '', 0, reps);
    setPanel(`
      <div class="pn-title">② ストレッチ ${x + 1}/4：${ex.name}（${reps}回）</div>
      <div class="pn-text">${esc(screen ? ex.screenHow : ex.how)}</div>
      <div class="row">
        <button class="btn primary" data-act="go">始める（Space）</button>
        <button class="btn" data-act="skip">この種目を飛ばす（→）</button>
        <button class="btn" data-act="skipall">ストレッチを全部飛ばす</button>
        <span class="muted" id="auto-start">6秒後に始まります</span>
      </div>`);
    const local = new AbortController();
    const wait = waitAct({ ' ': 'go', Enter: 'go', ArrowRight: 'skip' }, local.signal);
    let left = 6;
    const iv = setInterval(() => {
      left--;
      const el = $('#auto-start');
      if (el) el.textContent = `${left}秒後に始まります`;
      if (left <= 0) local.abort();
    }, 1000);
    let act;
    try { act = (await wait) ?? 'go'; } finally { clearInterval(iv); }
    if (act === 'skipall') break;
    if (act === 'skip') continue;
    const r = await runBeats(ex, Math.max(400, Math.round(base * ex.factor)), reps, screen);
    if (r === 'skipall') break;
  }
}

async function rest(sec) {
  $('#stage').innerHTML = `<div class="stretch"><div class="st-name">休憩</div><div class="st-beat" id="rest-n">${sec}</div>
    <div class="st-how">比較用の回です。ストレッチの代わりに、目を軽く閉じるなどして休みます。</div></div>`;
  setPanel(`<div class="pn-title">② 休憩（比較用）</div>
    <div class="pn-text">トレーニングの回と時間をそろえるための休憩です。時間になると音が鳴ります。</div>
    <div class="row"><button class="btn" data-act="skip">休憩を終える（→）</button></div>`);
  const local = new AbortController();
  const t0 = performance.now();
  const iv = setInterval(() => {
    const leftSec = Math.max(0, sec - Math.floor((performance.now() - t0) / 1000));
    const el = $('#rest-n');
    if (el) el.textContent = leftSec;
    if (leftSec <= 0) local.abort();
  }, 250);
  let act;
  try { act = await waitAct({ ArrowRight: 'skip' }, local.signal); } finally { clearInterval(iv); }
  // 目を閉じていても分かるように、時間になったら音で知らせる（自分で終えたときは鳴らさない）
  if (act === null) audio.play('done');
}

// ⚑が本文の枠に収まらなければ、1行の字数を枠いっぱいまで広げ、文字を1pxずつ小さくする（このトレーニングの間だけ）
function fitFlag(p, flag) {
  const off = () => !flag || flag.getBoundingClientRect().bottom > p.getBoundingClientRect().bottom - 2;
  let fs = state.settings.fontSize, shrunk = false;
  const width = $('#stage').clientWidth - 48;
  while (off() && fs >= 14) {
    p.style.setProperty('--cpl', clamp(Math.floor(width / fs), state.settings.cpl, 60));
    p.style.setProperty('--fs', `${fs}px`);
    fitPassage();
    shrunk = true;
    fs--;
  }
  return { shrunk, offscreen: off() };
}

async function training() {
  const ps = S.pre;
  const k = Math.max(1, Math.round(S.preRes.count * S.mult));
  const t = idxOr(indexAtCount(ps.m, ps.start, k), ps.m.n - 1);
  S.target = t;
  S.targetCount = remaining(ps.m, ps.start) - remaining(ps.m, t + 1);
  const end = Math.max(passageEnd(ps.m, ps.start, S.est * 6), idxOr(indexAtCount(ps.m, t + 1, 200), ps.m.n - 1) + 1);
  const p = mountPassage(ps.m, ps.start, Math.min(end, ps.m.n), t);
  const flagEl = p.querySelector('.flag');
  let needStart = true, shrunk = false;
  for (let r = 0; r < 3; r++) {
    const fit = fitFlag(p, flagEl); // ウィンドウの大きさが変わっていれば合わせ直す
    shrunk = shrunk || fit.shrunk;
    const offscreen = fit.offscreen;
    setPanel(`
      <div class="pn-title">③ トレーニング ${r + 1}/3：読めないくらいの速さで、⚑まで目で追います</div>
      <div class="pn-text">⚑は ${S.preRes.count}字 × ${fmtMult(S.mult)} ≈ ${S.targetCount}字の位置です。読もうとせず、文字を目で追うだけで構いません。
        ${offscreen ? '<b>⚑が画面の外にあります。ウィンドウを大きく（F11で全画面）してから始めてください。</b>' : shrunk ? '⚑が画面に収まるように、このトレーニングの間だけ1行の字数と文字の大きさを変えています。' : ''}</div>
      <div class="row">${needStart ? '<button class="btn primary" data-act="go">開始（Space）</button>' : '<span class="muted">3・2・1のあと、読み始めに戻って追います。</span>'}</div>`);
    if (needStart) {
      await waitAct({ ' ': 'go', Enter: 'go' });
      $('#panel .row').innerHTML = '<span class="muted">⚑まで目で追います…</span>';
    }
    needStart = false;
    noteSeen(ps.m, t); // ここで中断しても、⚑までは目を通した範囲として残す
    try {
      await sixSeconds(p);
    } catch (e) {
      if (e !== INVALID) throw e;
      toast(invalidMsg('この回をやり直します。'));
      r--;
      needStart = true;
      continue;
    }
    setPanel(`
      <div class="pn-title">${r + 1}回目はどうでしたか？</div>
      <div class="row">${ROUNDS.map((x, j) => `<button class="btn" data-act="${x.key}">${j + 1} ${x.label}</button>`).join('')}</div>`);
    S.rounds.push(await waitAct({ 1: 'reached', 2: 'readable', 3: 'short' }));
  }
}

async function controlReading() {
  const ps = S.pre;
  const p = mountPassage(ps.m, ps.start, passageEnd(ps.m, ps.start, S.est * 6));
  // 3回読むうちに先まで進んでいるかもしれないので、事前計測の2倍までを読んだ範囲とみなす
  S.target = idxOr(indexAtCount(ps.m, ps.start, S.preRes.count * 2 + 20), ps.m.n - 1);
  for (let r = 0; r < 3; r++) {
    setPanel(`
      <div class="pn-title">③ ふつうに読む ${r + 1}/3（比較用）</div>
      <div class="pn-text">事前計測と同じ文章を、ふつうの速さで6秒間読みます。</div>
      <div class="row"><button class="btn primary" data-act="go">開始（Space）</button></div>`);
    await waitAct({ ' ': 'go', Enter: 'go' });
    setPanel(`<div class="pn-title muted">ふつうに読む ${r + 1}/3：読んでいます…</div>`);
    noteSeen(ps.m, S.target);
    try {
      await sixSeconds(p);
    } catch (e) {
      if (e !== INVALID) throw e;
      toast(invalidMsg('この回をやり直します。'));
      r--;
    }
  }
}

function choosePost() {
  const ps = S.pre;
  if (state.settings.remeasure === 'same') return { m: ps.m, start: ps.start, mode: 'same' };
  const need = Math.round(S.est * 2) + 200;
  const start = nextSentenceStart(ps.m, S.seen[ps.m.id] ?? S.target);
  if (remaining(ps.m, start) >= need) return { m: ps.m, start, mode: 'unread' };
  noteSeen(ps.m, ps.m.n - 1);
  return { ...pickStart(need, nextStoryId(ps.m.id)), mode: 'unread' };
}

function commitCursors() {
  for (const [id, idx] of Object.entries(S.seen)) {
    const m = model(id);
    state.progress.cursors[id] = Math.max(state.progress.cursors[id] || 0, nextSentenceStart(m, idx));
  }
  state.progress.storyId = (S.post || S.pre).m.id;
}

function commitSession() {
  const rec = {
    id: `${S.startedAt}-${state.sessions.length}`,
    date: S.startedAt,
    type: S.type,
    storyId: S.pre.m.id,
    preStart: S.pre.start,
    pre: { count: S.preRes.count, comp: S.preRes.comp },
    post: { count: S.postRes.count, comp: S.postRes.comp, mode: S.post.mode, storyId: S.post.m.id, start: S.post.start },
    multiplier: S.type === 'train' ? S.mult : null,
    targetCount: S.type === 'train' ? S.targetCount : null,
    rounds: S.rounds.slice(),
    durationSec: Math.round((Date.now() - Date.parse(S.startedAt)) / 1000),
  };
  if (S.type === 'train' && state.settings.autoMultiplier) {
    const c = key => rec.rounds.filter(x => x === key).length;
    const delta = c('readable') >= 2 ? 0.25 : c('short') >= 2 ? -0.25 : 0;
    const next = clamp(S.mult + delta, Math.min(2.5, S.mult), Math.max(3.5, S.mult));
    rec.nextMultiplier = next;
    state.settings.multiplier = next;
  }
  state.sessions.push(rec);
  commitCursors();
  save();
  return rec;
}

async function runSession(type) {
  const est = recentBaseline();
  const mult = clamp(Number(state.settings.multiplier) || 3, 2, 4);
  S = { type, ac: new AbortController(), est, mult, startedAt: new Date().toISOString(), seen: {}, rounds: [], post: null };
  S.pre = { ...pickStart(needFor(est, mult), state.progress.storyId), mode: 'unread' };
  showSessionUI(type);
  await sleep(0);
  try {
    setStep('pre');
    S.preRes = await measure('pre');
    setStep('stretch');
    if (type === 'train') await stretch(); else await rest(60);
    setStep('train');
    if (type === 'train') await training(); else await controlReading();
    S.post = choosePost();
    setStep('post');
    S.postRes = await measure('post');
    const rec = commitSession();
    endSessionUI();
    showResult(rec);
  } catch (e) {
    if (e !== ABORT) console.error(e);
    commitCursors();
    save();
    endSessionUI();
    go('home');
    toast(e === ABORT ? '中断しました。読んだところまでは、次回から続きの文章になります。' : `エラーが起きたので中断しました：${e.message}`);
  }
}

function startSession(type) {
  if (S || !STORIES.length) return;
  if (!state.ackCaution) { showCaution(() => startSession(type)); return; }
  audio.ensure();
  runSession(type);
}

// ---------- 操作 ----------
const COMMANDS = {
  start: () => startSession('train'),
  'start-control': () => startSession('control'),
  'restart-story': () => {
    if (!confirm('この作品を最初から読み直しますか？')) return;
    state.progress.cursors[state.progress.storyId] = 0;
    save();
    go('home');
  },
  'test-sound': () => {
    // 作ったばかりの AudioContext がすぐには動き出さないブラウザ（Firefox など）があるので、動き出してから鳴らす
    const ctx = audio.ensure();
    if (ctx) ctx.resume().then(() => audio.schedule([['tick', 0], ['tick', 400], ['tick', 800], ['go', 1200], ['end', 2000]]), () => {});
  },
  'export-json': () => download(`six-second-reading-${dayKey(new Date())}.json`,
    JSON.stringify({ app: 'six-second-reading', exportedAt: new Date().toISOString(), state }, null, 1), 'application/json'),
  import: () => $('#import-file').click(),
  'export-csv': () => {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const head = ['日時', '作品', '種類', '事前字数', '再計測字数', '差', '倍率', '事前の分かり具合', '再計測の分かり具合', '振り返り', '再計測の文章', '再計測の作品', '⚑の字数', '次回の倍率'];
    const lines = state.sessions.map(s => [
      fmtDateTime(s.date), storyTitle(s.storyId), s.type === 'train' ? 'トレーニング' : '比較用',
      s.pre.count, s.post.count, s.post.count - s.pre.count, s.multiplier ?? '',
      COMP_LABEL[s.pre.comp] || '', COMP_LABEL[s.post.comp] || '',
      s.rounds.map(r => ROUND_LABEL[r]).join('・'), s.post.mode === 'same' ? '同じ文章' : '続きの文章',
      storyTitle(s.post.storyId || s.storyId), s.targetCount ?? '', s.nextMultiplier ?? '',
    ].map(q).join(','));
    download(`six-second-reading-${dayKey(new Date())}.csv`, '﻿' + [head.map(q).join(','), ...lines].join('\r\n'), 'text/csv');
  },
  clear: () => {
    if (!confirm('記録をすべて消しますか？（設定と読む位置は残ります）')) return;
    state.sessions = [];
    save();
    go('history');
  },
};

function importFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let next;
    try {
      const data = JSON.parse(reader.result);
      const src = data && (data.state || data);
      if (!src || !Array.isArray(src.sessions)) throw new Error('format');
      next = normalizeState(src);
    } catch {
      toast('読み込めませんでした。このアプリで書き出したJSONファイルか確認してください。');
      return;
    }
    if (!confirm(`記録 ${next.sessions.length}回分を読み込み、今の記録と置き換えますか？（読む位置は、先まで進んでいる方を残します）`)) return;
    for (const [id, c] of Object.entries(state.progress.cursors)) {
      next.progress.cursors[id] = Math.max(next.progress.cursors[id] || 0, c || 0);
    }
    state = next;
    save();
    go('history');
    toast('読み込みました。');
  };
  reader.readAsText(file);
}

document.addEventListener('click', e => {
  if (S || modalOpen()) return;
  const nav = e.target.closest('[data-nav]');
  if (nav) { nav.blur(); go(nav.dataset.nav); return; }
  const cmd = e.target.closest('[data-cmd]');
  if (cmd && COMMANDS[cmd.dataset.cmd]) COMMANDS[cmd.dataset.cmd]();
});

document.addEventListener('input', e => { if (e.target.dataset.set) applySetting(e.target); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.set) applySetting(t);
  else if (t.id === 'story-select') { state.progress.storyId = t.value; save(); go('home'); }
  else if (t.id === 'import-file') { importFile(t.files[0]); t.value = ''; }
});

document.addEventListener('keydown', e => {
  if (S) {
    if (e.key === 'Escape') { e.preventDefault(); requestAbort(); }
    return;
  }
  if (modalOpen() || e.key !== 'Enter' || e.repeat) return;
  // フォーカスのあるボタンやリンクは、Enter でそのボタン自身を押す
  if (e.target.closest && e.target.closest('input, select, textarea, button, a, label')) return;
  if (current === 'home') { e.preventDefault(); startSession('train'); }
  else if (current === 'result') { e.preventDefault(); go('home'); }
});

$('#abort-btn').addEventListener('click', e => { e.currentTarget.blur(); requestAbort(); });
window.addEventListener('resize', () => { if (S) fitPassage(); });
// セッションの途中で再読み込みしたり閉じたりしても、読んだ範囲は次回に持ち越す
window.addEventListener('pagehide', () => { if (S) { commitCursors(); save(); } });

go('home');
if (!state.ackCaution && STORIES.length) showCaution(() => {});
</script>
